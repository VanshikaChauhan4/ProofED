  <title>User Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card">
  <h2>User Login</h2>

  <!--  PHOTO CIRCLE -->
  <div class="avatar" onclick="document.getElementById('userPhoto').click()">
    <img id="userPreview">
    <span id="userText">Upload Photo</span>
    <input type="file" id="userPhoto" accept="image/*">
  </div>

  <input type="text" id="userName" placeholder="Full Name">
  <input type="email" id="userEmail" placeholder="Email">
  <input type="password" id="userId" placeholder="ID Number">

  <button onclick="userLogin()">Login</button>
</div>

<script src="institute.js"></script>
</body>
</html>
